{{- if and .Values.config.host .Values.config.certificateArn }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "actioncloud.fullname" . }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.config.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.config.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "actioncloud.fullname" . }}-api
                port: {number: {{ .Values.api.service.port }}}
{{- end }}
