{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "actioncloud.fullname" . }}-dashboard
  labels:
    {{- include "actioncloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "actioncloud.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "actioncloud.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "actioncloud.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dashboard
          image: "{{ required "dashboard.image.repository must be configured when dashboard.enabled=true" .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports: [{name: http, containerPort: 8501}]
          env:
            - {name: DB_HOST, value: {{ required "config.dbHost must be configured" .Values.config.dbHost | quote }}}
            - {name: DB_PORT, value: {{ .Values.config.dbPort | quote }}}
            - {name: DB_NAME, value: {{ .Values.config.dbName | quote }}}
            - {name: AWS_REGION, value: {{ .Values.config.awsRegion | quote }}}
            - {name: AWS_SECRETS_MANAGER_ARN, value: {{ .Values.config.secretsManagerArn | quote }}}
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /_stcore/health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "actioncloud.fullname" . }}-dashboard
  labels:
    {{- include "actioncloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "actioncloud.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
  ports:
    - {name: http, port: {{ .Values.dashboard.service.port }}, targetPort: http}
{{- end }}
