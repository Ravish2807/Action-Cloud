{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "actioncloud.fullname" . }}
  labels:
    {{- include "actioncloud.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.migration.serviceAccountName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    eks.amazonaws.com/role-arn: {{ required "migration.serviceAccountRoleArn must be configured" .Values.migration.serviceAccountRoleArn | quote }}
  labels:
    {{- include "actioncloud.labels" . | nindent 4 }}
