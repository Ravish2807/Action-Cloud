apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "actioncloud.fullname" . }}-migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "actioncloud.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.migration.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "scripts/migrate.py"]
          env:
            - {name: DB_HOST, value: {{ required "config.dbHost must be configured" .Values.config.dbHost | quote }}}
            - {name: DB_PORT, value: {{ .Values.config.dbPort | quote }}}
            - {name: DB_NAME, value: {{ .Values.config.dbName | quote }}}
            - {name: AWS_REGION, value: {{ .Values.config.awsRegion | quote }}}
            - {name: AWS_SECRETS_MANAGER_ARN, value: {{ .Values.config.secretsManagerArn | quote }}}
            - {name: AWS_MIGRATION_MASTER_SECRET_ARN, value: {{ .Values.config.databaseMasterSecretArn | quote }}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
