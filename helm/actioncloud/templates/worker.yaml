apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "actioncloud.fullname" . }}-worker
  labels:
    {{- include "actioncloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "actioncloud.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "actioncloud.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "actioncloud.fullname" . }}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "actioncloud.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "actioncloud.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "actioncloud.worker"]
          env:
            - {name: DB_HOST, value: {{ required "config.dbHost must be configured" .Values.config.dbHost | quote }}}
            - {name: DB_PORT, value: {{ .Values.config.dbPort | quote }}}
            - {name: DB_NAME, value: {{ .Values.config.dbName | quote }}}
            - {name: AWS_REGION, value: {{ .Values.config.awsRegion | quote }}}
            - {name: QUEUE_NAME, value: {{ .Values.config.queueName | quote }}}
            - {name: AWS_SECRETS_MANAGER_ARN, value: {{ .Values.config.secretsManagerArn | quote }}}
            - {name: SYNC_WRITE, value: {{ .Values.config.syncWrite | quote }}}
            - {name: AUTH_REQUIRED, value: {{ .Values.config.authRequired | quote }}}
            - {name: EMBEDDING_PROVIDER, value: {{ .Values.config.embeddingProvider | quote }}}
            - {name: EMBEDDING_DIM, value: {{ .Values.config.embeddingDim | quote }}}
            - {name: MEMORY_MIN_CONFIDENCE, value: {{ .Values.config.memoryMinConfidence | quote }}}
            - {name: MEMORY_SIMILARITY_THRESHOLD, value: {{ .Values.config.memorySimilarityThreshold | quote }}}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
