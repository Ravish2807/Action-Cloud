name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: actioncloud
          POSTGRES_PASSWORD: actioncloud
          POSTGRES_DB: actioncloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actioncloud -d actioncloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: actioncloud
      DB_USER: actioncloud
      DB_PASSWORD: actioncloud
      SYNC_WRITE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/migrate.py
      - run: ruff check --isolated --select E4,E7,E9,F src/actioncloud/api.py src/actioncloud/config.py src/actioncloud/secrets.py src/actioncloud/prometheus_metrics.py src/actioncloud/benchmark/simulator.py scripts/migrate.py tests/test_prometheus_metrics.py tests/test_secrets.py
      - run: mypy --follow-imports=skip --ignore-missing-imports src/actioncloud/api.py src/actioncloud/config.py src/actioncloud/secrets.py src/actioncloud/prometheus_metrics.py scripts/migrate.py
      - run: pytest -q

  infrastructure:
    name: Deployment configuration validation (no AWS)
    runs-on: ubuntu-latest
    environment:
      name: deployment-validation
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Terraform format and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Helm lint
        run: >-
          helm lint helm/actioncloud
          --set image.repository=example/actioncloud
          --set config.dbHost=example.invalid
          --set serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::111111111111:role/example
          --set migration.serviceAccountRoleArn=arn:aws:iam::111111111111:role/example
          --set dashboard.enabled=true
          --set dashboard.image.repository=example/actioncloud-dashboard
          --set dashboard.public.enabled=true
          --set "dashboard.public.allowedCidrs[0]=198.51.100.0/24"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: actioncloud:ci
